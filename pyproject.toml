[project]
name = "kidde-collector"
dynamic = ["version"]
description = "Data collection service for Kidde HomeSafe smart smoke/CO detectors — polls the Kidde cloud API and writes device + air-quality metrics to InfluxDB."
authors = [{ name = "Luxardo Labs" }]
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "aiofiles>=24.1.0,<25.0.0",
    "influxdb-client>=1.50.0,<2.0.0",
    # --- Security floor (luxaudit) ---
    # aiohttp is a DIRECT dependency here (the collector's HTTP client and the transport
    # under InfluxDBClientAsync), but it is also pulled transitively by influxdb-client
    # through an unbounded range — so a plain re-lock can resolve straight back to a
    # vulnerable build and "re-locked = patched" is a trap (luxaudit). The floor is
    # declared HERE, in our own manifest, so the lock cannot pick below the fix:
    # CVE-2026-69244 (OOB heap read in the C response parser while building the error
    # message for a malformed response — we are a client, so a misbehaving Kidde cloud
    # endpoint or InfluxDB reaches it), CVE-2026-69243 (WebSocket-upgrade request
    # smuggling), CVE-2026-59881 (RSV1 frames decompressed without permessage-deflate).
    # All fixed in 3.14.3.
    "aiohttp>=3.14.3,<4.0.0",
]

# The fleet build backend is hatchling (repo.hatchling_build_backend) and the VERSION file
# is the ONE version literal (repo.version_single_source) — everything else derives, so a
# pyproject/VERSION drift cannot recur. Poetry remains the dependency manager and
# poetry.lock is unaffected; every Dockerfile runs `poetry install --no-root`, so the
# backend is never exercised at image-build time.
[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Poetry is the DEPENDENCY MANAGER here, not the build backend — so it runs in
# non-package mode. Both Dockerfiles do `poetry install --no-root` (deps only; the app is
# copied in, never wheel-installed), so Poetry never needs to build or version this
# project. This is also what keeps repo.version_single_source honest: package mode would
# demand a `[tool.poetry] version = "..."` literal — exactly the second version
# declaration that drifts. The version has one home: the VERSION file.
[tool.poetry]
package-mode = false

# The dev group exists for ONE consumer: the pytest suite (Dockerfile.test installs
# `--with dev`). ruff, mypy and the types-* stubs are deliberately NOT here — luxlint runs
# ruff and mypy inside its own pinned image against the mounted repo (`make lint` /
# `make mypy` are mount-only), so a copy in this group is never invoked by any make target
# and is invisible to those runs. Keeping them would pin a second, drifting version of the
# very tools the guard owns.
[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-mock = "^3.14.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- ruff / mypy / pytest config are NOT carried here -------------------------
# The canonical ruff + mypy + pytest standard is owned by luxlint (one fleet config,
# byte-identical, shipped in the mount-only image) and enforced via `make lint` / `make
# mypy` (luxlint's `lint.no_local_ruff_config` / `types.no_local_mypy_config` /
# `test.no_local_pytest_config` checks forbid a per-repo [tool.ruff] / [tool.mypy] /
# [tool.pytest.ini_options] here). `make test` runs the canonical pytest config via
# `luxlint --emit-config pytest` → `pytest -c <it>`; `make format` applies the canonical
# ruff config in place with `luxlint --format`.
