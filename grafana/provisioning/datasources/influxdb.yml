# Grafana datasource for the bundled InfluxDB. The dashboards use InfluxQL and select
# their datasource via the ${data_source} picker variable, which resolves to the
# default datasource — so this one is marked isDefault. Auth to InfluxDB 2.x's
# v1-compat API is via an Authorization: Token header. Values come from the env compose
# passes into the Grafana container: INFLUX_HOST names that stack's InfluxDB service
# (kidde_influxdb for the local dev and demo stacks, kidde_dev_influxdb on the dev host).
apiVersion: 1

datasources:
  - name: InfluxDB
    uid: kidde_influxdb
    type: influxdb
    access: proxy
    url: http://${INFLUX_HOST}:8086
    isDefault: true
    jsonData:
      version: InfluxQL
      dbName: ${INFLUX_BUCKET}
      httpMode: GET
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: Token ${INFLUX_TOKEN}
    editable: true
