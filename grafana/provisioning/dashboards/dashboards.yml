# Auto-load the bundled Kidde Collector dashboards from grafana/shared-local
# (mounted at /var/lib/grafana/dashboards in the dev/demo stacks).
apiVersion: 1

providers:
  - name: kidde-collector
    orgId: 1
    folder: Kidde Collector
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
