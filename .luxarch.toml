# Pilot key for kidde-collector (collector). Proves parity: reproduces kidde's
# local `make arch`, and is strictly tighter (adds the add_signal_handler rule
# kidde's own test omits — kidde already passes it).

[[target]]
kind = "collector"
app = "app"
source_client = ["collector/session.py"]   # kidde's long-lived source session

# --- opt-in overlays: decided, not merely absent -------------------------------
#
# Recorded as a first-class disposition (luxarch 0.135.0 [observability].exempt_reason)
# rather than the prose comment this started as — a reason in the toml is re-checked every
# run and shows in the diff, where a comment just rots.
#
# The obs.* overlay turns on "when the repo ships telemetry" (--doc REFERENCE). This
# collector ships none: zero opentelemetry / prometheus_client / tracing dependencies in
# pyproject or poetry.lock, and no span/tracer call anywhere in app/. Its rules govern span
# markers, span-kind on client calls and metric-label cardinality — none of which would have
# anything to bind to here, so enabling it would either red every rule against code that does
# not exist or force a tracing layer to be invented purely to satisfy a guard (the
# hollow-green trade ADR-004 warns about, from the other side). Revisit if OTel is ever added.
[observability]
enabled = false
exempt_reason = "headless collector, no telemetry shipped: zero opentelemetry/prometheus_client dependencies and no span or tracer call in app/. Operational signal is the structured log stream (app/utils/logging.py) plus the InfluxDB series it writes, which a dashboard reads staleness from directly."
