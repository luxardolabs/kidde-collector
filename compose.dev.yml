name: kidde-collector-dev

# DEV stack — your daily local driver. The collector authenticates against the REAL
# Kidde cloud (account creds from the optional, gitignored .env.dev.local) and writes
# to a bundled InfluxDB + pre-provisioned Grafana (datasource + dashboards). Bring up
# with `make dev-up`, open Grafana at http://localhost:3000 (admin/admin). Bundled-infra
# config is in .env.demo. `make dev-up` builds the local image and sets KIDDE_IMAGE.
# Everything is on the default bridge network — the collector reaches the bundled
# InfluxDB by service name (Kidde is a cloud API, so no host networking needed).

services:
  kidde_influxdb:
    image: influxdb:2.7
    container_name: kidde_influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - kidde_influxdb_data:/var/lib/influxdb2
      - ./ops/influxdb/init-dbrp.sh:/docker-entrypoint-initdb.d/init-dbrp.sh:ro
    # NO host port. The collector and Grafana both reach InfluxDB over the compose
    # network (http://kidde_influxdb:8086), so publishing it only creates a fleet-wide
    # collision — 8086 is owned by whichever collector stack came up first. Uncomment to
    # poke the API by hand, and use a port that is yours:
    #   ports: ["${INFLUX_PORT:-18386}:8086"]
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  kidde_grafana:
    image: grafana/grafana:11.3.0
    container_name: kidde_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/shared-local:/var/lib/grafana/dashboards:ro
      - kidde_grafana_data:/var/lib/grafana
    # Grafana IS published — a human opens it in a browser; that is the one thing here
    # that genuinely needs a host port. The default is kidde's own port, not 3000: this
    # host already runs kasa on 3100, luxsignal on 3200 and sense on 13300/13301, and 3000
    # belongs to whatever app claimed it first. Override with GRAFANA_PORT if 3300 clashes.
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    depends_on:
      kidde_influxdb:
        condition: service_healthy
    restart: unless-stopped

  kidde-collector:
    image: ${KIDDE_IMAGE:-ghcr.io/luxardolabs/kidde-collector:latest}
    container_name: kidde-collector
    env_file:
      # .env.demo = bundled InfluxDB/Grafana config. .env.dev.local (gitignored,
      # optional) adds your REAL Kidde account creds — see .env.dev.local.example.
      # Later file wins on shared keys.
      - .env.demo
      - path: .env.dev.local
        required: false
    restart: unless-stopped
    depends_on:
      kidde_influxdb:
        condition: service_healthy
    volumes:
      - kidde_collector_output:/app/output

volumes:
  kidde_influxdb_data:
  kidde_grafana_data:
  kidde_collector_output:
