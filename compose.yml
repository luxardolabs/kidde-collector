name: ${COMPOSE_NAME:-kidde-collector}

# THE compose file — one per repo (repo.compose_conventions). Environments differ by
# `.env.<env>`, variant stacks by `profiles:`. Nothing is built here: every image is built
# outside compose (`make build-local` / `make release` / `make harness-build`) and this file
# only RUNS a tag. See luxarch --doc FLEET-BUILD-DEPLOY-STANDARD / --playbook compose-hygiene.
#
#   docker compose --env-file .env.prod up -d                      # prod: collector only
#   docker compose --env-file .env.dev  up -d                      # collector -> YOUR InfluxDB
#   make dev-deploy  (.env.dev: COMPOSE_PROFILES=devhost)          # dev host: + its own pair
#   docker compose --env-file .env.demo --profile demo up -d       # fake Kidde + bundled stack
#   KIDDE_LOCAL_ENV_FILE=.env.dev.local \
#     docker compose --env-file .env.demo --profile dev  up -d     # REAL Kidde + bundled stack
#   docker compose --env-file .env.e2e  --profile e2e  up -d       # hardware-free e2e
#
# The Makefile wraps the bundled stacks (`make demo-up`, `make dev-up`, `make test-e2e`) on this
# machine.
#
# THE DEV STACK RUNS ON THE DEV HOST (`DEV_HOST` in the Makefile; FLEET-BUILD-DEPLOY-STANDARD,
# "The dev host"): `make dev-deploy` / `make dev-pin` start the collector plus the `devhost`
# profile's own InfluxDB and Grafana, and publish no host port. That Grafana joins the dev host's
# `dev-edge` network at its pinned address (172.30.0.17), where the edge serves it by its dev name.
#
# Kidde is a cloud API, so the collector publishes NO port — it reaches OUT to Kidde and OUT
# to InfluxDB. Only the local Grafana publishes, because a human opens it in a browser.

x-logging: &logging
  driver: ${LOG_DRIVER:-json-file}
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-5}"

services:
  # The collector runs in EVERY stack, so it carries no profile. What changes between
  # stacks is configuration, and that lives in the `.env.<env>` named by ENV_FILE.
  kidde-collector:
    # REGISTRY set -> the pulled, registry-qualified release; REGISTRY empty -> the BARE local
    # build (`make build-local`, never pushed — repo.image_name_declares_provenance).
    image: ${REGISTRY:+${REGISTRY}/luxardolabs/}kidde-collector:${TAG:?set TAG in your .env.<env>}
    container_name: kidde-collector
    env_file:
      - ${ENV_FILE:?set ENV_FILE to this stack's .env.<env>}
      # Your REAL Kidde account, for the bundled dev stack only (`make dev-*` sets
      # KIDDE_LOCAL_ENV_FILE=.env.dev.local on that one command; see .env.dev.local.example).
      # Later file wins on shared keys, so no other stack names it: prod, demo, e2e and
      # .env.dev run as their own env file says. Never export it in your shell: every
      # compose command you run by hand would then take the dev account.
      - path: ${KIDDE_LOCAL_ENV_FILE:-/dev/null}
        required: false
    # The env file also configures the stack's own InfluxDB and Grafana. Their admin passwords
    # are blanked here so they never reach the collector, which holds only its InfluxDB token.
    environment:
      INFLUX_PASSWORD: ""
      GRAFANA_PASSWORD: ""
    restart: unless-stopped
    oom_score_adj: -500
    logging: *logging
    healthcheck:
      test: ["CMD", "python3", "-m", "app.health.check"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    volumes:
      - ${OUTPUT_VOLUME:-kidde_collector_output}:/app/output

  kidde_influxdb:
    profiles: ["dev", "demo", "e2e"]
    image: influxdb:2.7
    container_name: kidde_influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      # A NAMED volume, never the image's implicit anonymous one
      # (repo.compose_db_ephemeral_volume). `docker compose down -v` wipes it, which is
      # what the e2e teardown does every run.
      - kidde_influxdb_data:/var/lib/influxdb2
      # The image also declares /etc/influxdb2 (the CLI config written at setup) a VOLUME;
      # left unmapped it is a fresh anonymous volume every `up`, abandoned every `down`.
      - kidde_influxdb_config:/etc/influxdb2
      - ./ops/influxdb/init-dbrp.sh:/docker-entrypoint-initdb.d/init-dbrp.sh:ro
    # NO host port. The collector and Grafana both reach InfluxDB over the compose network
    # (http://kidde_influxdb:8086), so publishing it only creates a fleet-wide collision —
    # 8086 is owned by whichever collector stack came up first. To poke the API by hand,
    # uncomment and use a port that is yours:
    #   ports: ["${INFLUX_PORT:-18386}:8086"]
    healthcheck:
      # The real server, by address: during setup the CLI's default host is the temporary
      # setup server, which answers before :8086 accepts connections.
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    oom_score_adj: -500
    logging: *logging

  kidde_grafana:
    profiles: ["dev", "demo"]
    image: grafana/grafana:11.3.0
    container_name: kidde_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUX_HOST: kidde_influxdb
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/shared-local:/var/lib/grafana/dashboards:ro
      - kidde_grafana_data:/var/lib/grafana
    # Grafana IS published — a human opens it in a browser; that is the one thing here that
    # genuinely needs a host port. 3000 is Grafana's universal default and that is what
    # ships. If it is taken on YOUR machine (a lab host running several stacks), override
    # GRAFANA_PORT locally — do not change what the project ships.
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      kidde_influxdb:
        condition: service_healthy
    restart: unless-stopped
    oom_score_adj: -500
    logging: *logging

  # ── profile: devhost ───────────────────────────────────────────────────────
  # The dev stack's own InfluxDB + Grafana on the dev host, with no host port. The collector
  # writes to InfluxDB by service name (http://kidde_dev_influxdb:8086, in .env.dev); Grafana
  # reads it by the same name.
  kidde_dev_influxdb:
    profiles: ["devhost"]
    image: influxdb:2.7
    container_name: kidde_dev_influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - kidde_dev_influxdb_data:/var/lib/influxdb2
      - kidde_dev_influxdb_config:/etc/influxdb2
      - ./ops/influxdb/init-dbrp.sh:/docker-entrypoint-initdb.d/init-dbrp.sh:ro
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    oom_score_adj: -500
    logging: *logging

  kidde_dev_grafana:
    profiles: ["devhost"]
    image: grafana/grafana:11.3.0
    container_name: kidde_dev_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUX_HOST: kidde_dev_influxdb
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    # Served by name on the dev host's edge, so it refuses a guessable admin password and
    # sets the one in the env file on every start (ops/grafana/dev-entrypoint.sh). The check
    # is in the container, not a required compose variable: compose interpolates every
    # service, and the demo, e2e and test stacks set no dev Grafana password. A missing bind
    # source arrives as a directory, which sh would run as a silent exit 0.
    entrypoint: ["/bin/sh", "-c", "test -f /ops/dev-entrypoint.sh || { echo 'REFUSING: /ops/dev-entrypoint.sh is not mounted: run the dev stack from a checkout the dev host has at the same path' >&2; exit 1; }; exec /bin/sh /ops/dev-entrypoint.sh"]
    volumes:
      - ./ops/grafana/dev-entrypoint.sh:/ops/dev-entrypoint.sh:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/shared-local:/var/lib/grafana/dashboards:ro
      - kidde_dev_grafana_data:/var/lib/grafana
    networks:
      default: {}
      # The edge routes by PINNED address on dev-edge, never by name: any container on the
      # network can claim an alias. 172.30.0.17 is the address this Grafana takes in the edge's
      # address table (the edge repo's README, "The dev-edge network and the address table"),
      # where the edge's route to it is added.
      dev-edge:
        ipv4_address: 172.30.0.17
    # `dev-pin` waits for healthy: a Grafana the guard refused restarts forever, and without a
    # healthcheck the deploy would report green over it.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      # A first start migrates a fresh database before the server answers.
      start_period: 120s
    depends_on:
      kidde_dev_influxdb:
        condition: service_healthy
    restart: unless-stopped
    oom_score_adj: -500
    logging: *logging

  # The real InfluxDB the pytest suite writes to (`make test` — the emitted test block starts it in
  # a compose project of its own per run, waits on the healthcheck, and tears it down). Ephemeral
  # by design: tmpfs data, no container_name, no host port, no named network. Fixed TEST values.
  kidde_influxdb_test:
    profiles: ["test"]
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: kidde
      DOCKER_INFLUXDB_INIT_PASSWORD: kidde-test-password
      DOCKER_INFLUXDB_INIT_ORG: kidde
      DOCKER_INFLUXDB_INIT_BUCKET: kidde
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: kidde-test-token
    tmpfs:
      - /var/lib/influxdb2
      - /etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 2s
      timeout: 3s
      retries: 60
    oom_score_adj: 500

  # Fake Kidde cloud endpoint (the harness emulator) — no account, no hardware. Built
  # OUTSIDE compose by `make harness-build`, then run here by tag.
  kidde_fake:
    profiles: ["demo", "e2e"]
    image: ${REGISTRY:+${REGISTRY}/luxardolabs/}kidde-collector-fake:${TAG:?}
    container_name: kidde_fake
    environment:
      KIDDE_FAKE_PORT: "8080"
      KIDDE_FAKE_LOCATION_ID: "${KIDDE_FAKE_LOCATION_ID:-356103}"
      KIDDE_FAKE_LOCATION_LABEL: "${KIDDE_FAKE_LOCATION_LABEL:-Demo Home}"
    restart: unless-stopped
    oom_score_adj: -500
    logging: *logging

networks:
  # The dev host's edge (FLEET-BUILD-DEPLOY-STANDARD, "The dev host"): only the dev Grafana
  # joins it (pinned at 172.30.0.17), so only the dev host's stack needs it to exist.
  dev-edge:
    external: true

volumes:
  kidde_influxdb_data:
  kidde_influxdb_config:
  kidde_grafana_data:
  kidde_dev_influxdb_data:
  kidde_dev_influxdb_config:
  kidde_dev_grafana_data:
  kidde_collector_output:
