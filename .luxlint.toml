# luxlint — fleet code-style + type standard (sibling of .luxarch.toml).
# Carries only WHERE to look and what this repo defers — never lint config.
# The canonical ruff/mypy config lives in the luxlint image, byte-identical
# fleet-wide. See docs/ONBOARDING.md in the luxlint repo.

[source]
# Every first-party .py must be either covered here or excluded with a reason
# (lint.source_declared) — a file the gate never scans is a hollow green.
paths = [
    "app",      # the collector package — lint + format-check + mypy target
    "harness",  # the fake-Kidde emulator: first-party, ships in the demo/e2e stacks, held to the same bar
]

[python]
target = "py314"  # this collector runs Python 3.14 — per-repo fact (since luxlint 0.1.3),
                  # NOT baked into the fleet floor. Grants native PEP 758 except tuples +
                  # PEP 649 deferred annotations; ruff/mypy target py314 accordingly.

[gitleaks]
# Repo-specific known NON-secrets, appended to the canonical gitleaks allowlist at emit time
# (PATH regexes only; the org denylist for internal infra domain / retired identity stays baked in the
# luxlint image, never committed). .env.example / .env.demo / Makefile.local.example are already
# canonical. These are the demo/e2e/emulator files carrying throwaway test tokens.
allow = [
    '''(^|/)\.env\.dev\.local\.example$''',
    '''(^|/)compose\.e2e\.yml$''',
    '''(^|/)scripts/e2e-test\.sh$''',
    '''(^|/)harness/fake_kidde\.py$''',
]

# [rules.deferred]
# The ratchet dial (owner's call, mandatory evidence line, drains to zero).
# Reds are left RED and burned down via tickets, NOT parked here. Empty on purpose.

# --- Per-site ruff carve-outs (rule stays live everywhere else) --------------------
# code+file+match so only that literal is exempt; evidence required and re-checked every run.
# NOTE: the health/check.py T201 carve-out that used to live here was removed at luxlint
# 0.42.0, which added `**/health/check.py` to the FLEET T20 entrypoint carve-out (LUXSTATS-83)
# — a repo-local duplicate of a fleet exemption is drift.
[[allowlist.ruff]]
code     = "T201"
file     = "fake_kidde.py"
match    = "print("
evidence = "Standalone Kidde-cloud emulator started as a container CMD in the demo/e2e stacks; the startup banner (flush=True) is read via `docker logs` by scripts/e2e-test.sh. The module configures no logging at all — stdout is deliberately its only output, the 'standalone script whose purpose is stdout' class. Never imported by application code. Mirrors kasa-collector's fake_kasa.py carve-out."

[test]
# Coverage floor, enforced by `luxlint --coverage-ratchet` in `make test` (luxlint 0.44.0,
# which grew out of KIDDECOLLE-50). It is a RATCHET: it only ever moves UP. A drop below it
# is RED and the fix is more tests, never a lower floor.
#
# Adopted at 41% (the measured total when the ratchet landed) and burned down to 99%:
# client.py, endpoints.py, poller.py, logging.py at 100%; session.py 98; influxdb.py 98;
# health/check.py 98; config.py 100; main.py 91.
#
# 99% is the CEILING, not a stopping point short of 100: the only 6 uncovered lines are the
# two `if __name__ == "__main__":` guards (app/main.py and app/health/check.py), which pytest
# cannot enter by construction. Both are covered behaviourally anyway — the healthcheck CLI
# through main(), and the collector's startup/shutdown through `make test-e2e` plus a live
# SIGTERM check (clean exit 0 in 475 ms). Chasing the last 1% would mean runpy machinery that
# re-executes the entrypoint for no added assurance.
coverage_min = 99
